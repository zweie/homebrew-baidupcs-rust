name: Check upstream and bump formula

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tap this repo
        run: brew tap ${{ github.repository_owner }}/baidupcs "$GITHUB_WORKSPACE"

      - name: Bump if new upstream release exists
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew bump-formula-pr \
            --no-browse \
            --no-audit \
            ${{ github.repository_owner }}/baidupcs/baidupcs-rust
